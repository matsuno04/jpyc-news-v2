name: 毎日自動更新

on:
  schedule:
    # 主な起動は、daily-news-digest の Cloudflare Worker(daily-news-dispatcher)が JST 21:30 に
    # workflow_dispatch で行う(GitHubのscheduleは数時間遅れることがあり、デイリーニュースの夜の確定版
    # 21:45 に間に合わないため)。下の schedule(毎日 21:10 JST = 12:10 UTC)は予備として残している。
    # 重複して起動しても concurrency で直列化され、2回目は新着なしで終わる。
    # 検索期間は collector.py が決める(月曜は直近14日、それ以外は直近3日)
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "収集で見直す日数。空欄なら自動(月曜14日・それ以外3日)。取りこぼした期間を取り戻すときに広げる"
        required: false
        default: ""

permissions:
  contents: write

# 手動実行と定時実行が重なって二重に収集・分類・pushしないよう、同時に1つだけ動かす
concurrency:
  group: jpyc-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jpyc-news-v2 (public)
        uses: actions/checkout@v4

      - name: Checkout jpyc-news-data (private)
        uses: actions/checkout@v4
        with:
          repository: matsuno04/jpyc-news-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: jpyc-news-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: 記事収集 (新規のみ、既存urlは自動スキップ)
        env:
          FULL_DATA_PATH: jpyc-news-data/raw_articles_full.csv
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python pipeline/collector.py

      - name: Haiku分類 (failedを先にリトライ、pendingを分類)
        env:
          FULL_DATA_PATH: jpyc-news-data/raw_articles_full.csv
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/classifier.py

      - name: event_summary / daily_panel / 公開用raw_articles生成
        env:
          FULL_DATA_PATH: jpyc-news-data/raw_articles_full.csv
          PUBLIC_DATA_DIR: data
        run: python pipeline/panel_builder.py

      - name: 非公開リポジトリへコミット・プッシュ (本文データ)
        working-directory: jpyc-news-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_articles_full.csv url_map.csv fetch_failures.csv
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 公開リポジトリへコミット・プッシュ (data/, docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw_articles.csv data/event_summary.csv data/daily_panel.csv data/recent_events.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi
